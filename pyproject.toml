[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "multimodal-loop"
version = "0.1.0"
description = "Experimental multimodal recurrent-depth transformer research project"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "safetensors>=0.6,<1.0",
    "tqdm>=4.66,<5.0",
]


[project.optional-dependencies]

# For machines where we need pip to provide PyTorch.
torch = [
    "torch>=2.7,<3.0",
]

dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.16,<1.0",
]


# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["multimodal_loop*"]


# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    ".venv",
    "checkpoints",
    "outputs",
    "data/cache",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
